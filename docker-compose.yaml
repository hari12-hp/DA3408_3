services:

  ray-head:
    image: ray-assignment
    command: >
      ray start
      --head
      --port=6379
      --dashboard-host=0.0.0.0
      --dashboard-port=8265
      --num-cpus=0
      --block
    ports:
      - "8265:8265"
    volumes:
      - ../data:/ray/data
      - ..:/ray/assignment3
    networks:
      - ray-network

  ray-worker-1:
    image: ray-assignment
    command: >
      ray start
      --address=ray-head:6379
      --num-cpus=4
      --block
    depends_on:
      - ray-head
    volumes:
      - ../data:/ray/data
      - ..:/ray/assignment3
    networks:
      - ray-network

  ray-worker-2:
    image: ray-assignment
    command: >
      ray start
      --address=ray-head:6379
      --num-cpus=4
      --block
    depends_on:
      - ray-head
    volumes:
      - ../data:/ray/data
      - ..:/ray/assignment3
    networks:
      - ray-network

networks:
  ray-network:

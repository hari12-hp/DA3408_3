services:

  spark-master:
    image: apache/spark:3.5.6
    container_name: spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080
    ports:
      - "7077:7077"
      - "8080:8080"
      - "4040:4040"
    volumes:
      - ../data:/ray/data
      - ..:/ray/assignment3

  spark-worker-1:
    image: apache/spark:3.5.6
    container_name: spark-worker-1
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --cores 4
      --memory 12g
    volumes:
      - ../data:/ray/data
      - ..:/ray/assignment3

  spark-worker-2:
    image: apache/spark:3.5.6
    container_name: spark-worker-2
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --cores 4
      --memory 12g
    volumes:
      - ../data:/ray/data
      - ..:/ray/assignment3
